version: '3.7'
services:
  web:
    build: .
    container_name: local_cloud_app
    restart: unless-stopped
    networks:
      - appnet

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - appnet

networks:
  appnet:

volumes:
  caddy_data: 